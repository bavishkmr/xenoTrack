version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: xenotrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: xenotrack_root
      MYSQL_DATABASE: xenotrack
      MYSQL_USER: xenotrack_user
      MYSQL_PASSWORD: xenotrack_pass
    ports:
      - "3306:3306"
    volumes:
      - xenotrack_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  xenotrack_mysql_data:
